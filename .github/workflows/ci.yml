name: Verify ARBOR

on:
  push:
  pull_request:

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm ci
        working-directory: arbre-engine
      - run: npm run typecheck
        working-directory: arbre-engine
      - run: npm test
        working-directory: arbre-engine
